<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xadrez Master - Com Editor</title>
    <!-- Biblioteca de lógica Chess.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        :root {
            --bg-body: #262522;
            --bg-panel: #262522;
            --board-border: #3c3b39;
            --square-light: #f0d9b5; 
            --square-dark: #b58863;
            --coord-color: #8b8987;
            
            --highlight-selected: rgba(20, 85, 30, 0.5);
            --highlight-move: rgba(0, 0, 0, 0.15);
            --highlight-capture: rgba(0, 0, 0, 0.2);
            --highlight-check: radial-gradient(ellipse at center, #ff0000 0%, transparent 60%);
            
            --btn-bg: #454441;
            --btn-hover: #585653;
            --btn-disabled: #2f2e2c;
            --btn-text: #cacaca;
            --btn-active: #2b2a28;
            
            --modal-bg: rgba(0, 0, 0, 0.85);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg-body);
            color: #ccc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
        }

        h1 { margin-bottom: 5px; font-weight: 400; color: #fff; letter-spacing: 0.5px; }

        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            background-color: var(--bg-panel);
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
            position: relative;
        }

        /* Layout Tabuleiro */
        .board-container {
            display: grid;
            grid-template-columns: 25px auto;
            grid-template-rows: auto 25px;
        }

        .coords-rank {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            color: var(--coord-color);
            font-size: 13px;
            font-weight: 600;
        }

        .coords-file {
            grid-column: 2;
            display: flex;
            justify-content: space-around;
            align-items: center;
            color: var(--coord-color);
            font-size: 13px;
            font-weight: 600;
            padding-top: 4px;
        }

        #board {
            width: 480px;
            height: 480px;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            border: 3px solid var(--board-border);
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }

        /* Quando em modo editor, borda muda de cor para indicar */
        #board.editing {
            border-color: #d69e2e;
        }

        .square {
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: pointer;
        }

        .square.light { background-color: var(--square-light); }
        .square.dark { background-color: var(--square-dark); }
        .square.selected { background-color: var(--highlight-selected) !important; }
        .square.in-check { background: var(--highlight-check); }

        .hint-move::after {
            content: '';
            width: 20px;
            height: 20px;
            background-color: var(--highlight-move);
            border-radius: 50%;
            position: absolute;
            pointer-events: none;
        }

        .hint-capture::after {
            content: '';
            width: 54px;
            height: 54px;
            border: 5px solid var(--highlight-capture);
            border-radius: 50%;
            position: absolute;
            pointer-events: none;
        }

        .piece {
            width: 60px;
            height: 60px;
            background-size: 100%;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 10;
        }

        /* Status e Controles */
        #status {
            font-size: 1rem;
            color: #ddd;
            background: rgba(255,255,255,0.08);
            padding: 6px 16px;
            border-radius: 12px;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .controls {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            border-bottom: 3px solid rgba(0,0,0,0.2);
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        button:hover:not(:disabled) {
            background-color: var(--btn-hover);
            color: #fff;
            transform: translateY(-1px);
        }

        button:active:not(:disabled) {
            transform: translateY(1px);
            border-bottom-width: 0px;
            margin-top: 3px;
        }

        button:disabled {
            background-color: var(--btn-disabled);
            color: var(--btn-text-disabled);
            cursor: not-allowed;
            border-bottom: 3px solid transparent;
            transform: none;
        }

        .btn-restart { background-color: #bf4040; color: #ffdada; }
        .btn-restart:hover:not(:disabled) { background-color: #d64a4a; }
        
        .btn-editor { background-color: #d69e2e; color: #3e2c00; }
        .btn-editor:hover:not(:disabled) { background-color: #ecc94b; }
        .btn-editor.active { background-color: #b7791f; border-bottom-width: 0; transform: translateY(2px); box-shadow: inset 0 3px 5px rgba(0,0,0,0.2); }

        .editor-controls {
            display: none; /* Oculto por padrão */
            gap: 10px;
            margin-top: 10px;
            padding: 10px;
            background: rgba(0,0,0,0.2);
            border-radius: 5px;
            width: 100%;
            justify-content: center;
            box-sizing: border-box;
        }

        /* Modal de Seleção de Peças */
        #pieceSelectorModal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--modal-bg);
            z-index: 100;
            border-radius: 8px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .selector-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
            background: #333;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        .selector-piece {
            width: 50px;
            height: 50px;
            cursor: pointer;
            transition: transform 0.2s;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }
        .selector-piece:hover { transform: scale(1.2); }

        .selector-trash {
            grid-column: span 6;
            background-color: #bf4040;
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        .selector-trash:hover { background-color: #d64a4a; }
        
        .selector-cancel {
            margin-top: 10px;
            background: transparent;
            color: #aaa;
            border: 1px solid #555;
            padding: 5px 15px;
            cursor: pointer;
        }

    </style>
</head>
<body>

    <div class="game-wrapper">
        <h1>Xadrez Master</h1>
        
        <div id="status">Vez das Brancas</div>

        <div class="board-container">
            <div class="coords-rank">
                <span>8</span><span>7</span><span>6</span><span>5</span>
                <span>4</span><span>3</span><span>2</span><span>1</span>
            </div>

            <div id="board"></div>

            <div></div>

            <div class="coords-file">
                <span>a</span><span>b</span><span>c</span><span>d</span>
                <span>e</span><span>f</span><span>g</span><span>h</span>
            </div>
        </div>

        <!-- Botões Principais -->
        <div class="controls">
            <button id="btnUndo" onclick="undoMove()" disabled>Voltar</button>
            <button id="btnRedo" onclick="redoMove()" disabled>Avançar</button>
            <button class="btn-restart" onclick="restartGame()">Reiniciar</button>
            <button id="btnEditor" class="btn-editor" onclick="toggleEditor()">Modo Editor</button>
        </div>

        <!-- Controles Específicos do Editor -->
        <div id="editorControls" class="editor-controls">
            <button onclick="clearBoard()">🗑️ Limpar Tudo</button>
            <button onclick="setTurn('w')">Jogar de Brancas</button>
            <button onclick="setTurn('b')">Jogar de Pretas</button>
        </div>

        <!-- Modal de Seleção de Peças -->
        <div id="pieceSelectorModal">
            <h3 style="color:white; margin:0;">Escolha a Peça</h3>
            <div class="selector-grid" id="selectorGrid">
                <!-- Gerado via JS -->
            </div>
            <button class="selector-cancel" onclick="closePieceSelector()">Cancelar</button>
        </div>
    </div>

<script>
    const game = new Chess();
    let selectedSquare = null;
    let redoStack = [];
    let isEditorMode = false;
    let editingSquare = null; // Qual casa estamos editando

    const boardEl = document.getElementById('board');
    const statusEl = document.getElementById('status');
    const btnUndo = document.getElementById('btnUndo');
    const btnRedo = document.getElementById('btnRedo');
    const btnEditor = document.getElementById('btnEditor');
    const editorControls = document.getElementById('editorControls');
    const pieceSelectorModal = document.getElementById('pieceSelectorModal');

    // URLs Oficiais (Lichess)
    const getPieceUrl = (color, type) => {
        const c = color; 
        const t = type.toUpperCase();
        return `https://raw.githubusercontent.com/lichess-org/lila/master/public/piece/cburnett/${c}${t}.svg`;
    };

    function initBoard() {
        boardEl.innerHTML = '';
        const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
        const ranks = ['8', '7', '6', '5', '4', '3', '2', '1'];
        let isLight = true;

        for (let r = 0; r < 8; r++) {
            for (let f = 0; f < 8; f++) {
                const sqId = files[f] + ranks[r];
                const div = document.createElement('div');
                div.className = `square ${isLight ? 'light' : 'dark'}`;
                div.dataset.id = sqId;
                div.onclick = () => handleSquareClick(sqId);
                boardEl.appendChild(div);
                isLight = !isLight;
            }
            isLight = !isLight;
        }
        
        createPieceSelector();
        drawPieces();
        updateUI();
    }

    function drawPieces() {
        document.querySelectorAll('.square').forEach(sq => {
            sq.innerHTML = '';
            sq.classList.remove('selected', 'hint-move', 'hint-capture', 'in-check');
        });

        const board = game.board();
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const piece = board[r][c];
                if (piece) {
                    const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
                    const ranks = ['8', '7', '6', '5', '4', '3', '2', '1'];
                    const sqId = files[c] + ranks[r];
                    const sqDiv = document.querySelector(`.square[data-id="${sqId}"]`);
                    
                    if (sqDiv) {
                        const img = document.createElement('div');
                        img.className = 'piece';
                        img.style.backgroundImage = `url(${getPieceUrl(piece.color, piece.type)})`;
                        sqDiv.appendChild(img);

                        if (!isEditorMode && piece.type === 'k' && game.in_check() && piece.color === game.turn()) {
                            sqDiv.classList.add('in-check');
                        }
                    }
                }
            }
        }
        updateStatus();
    }

    function handleSquareClick(id) {
        // --- LÓGICA DO MODO EDITOR ---
        if (isEditorMode) {
            editingSquare = id;
            openPieceSelector();
            return;
        }

        // --- LÓGICA DO MODO JOGO ---
        const clickedPiece = game.get(id);
        
        if (selectedSquare === id) {
            selectedSquare = null;
            drawPieces();
            return;
        }

        if (selectedSquare) {
            const selectedPieceObj = game.get(selectedSquare);
            
            // Roque manual (Rei -> Torre)
            if (selectedPieceObj && selectedPieceObj.type === 'k' && 
                clickedPiece && clickedPiece.type === 'r' && clickedPiece.color === selectedPieceObj.color) {
                let castleMove = null;
                if (selectedSquare === 'e1') {
                    if (id === 'h1') castleMove = 'g1';
                    if (id === 'a1') castleMove = 'c1';
                }
                if (selectedSquare === 'e8') {
                    if (id === 'h8') castleMove = 'g8';
                    if (id === 'a8') castleMove = 'c8';
                }
                if (castleMove) {
                    if(attemptMove({ from: selectedSquare, to: castleMove })) return;
                }
            }

            if (attemptMove({ from: selectedSquare, to: id, promotion: 'q' })) return;
        }

        if (clickedPiece && clickedPiece.color === game.turn()) {
            selectedSquare = id;
            drawPieces();
            document.querySelector(`.square[data-id="${id}"]`).classList.add('selected');
            const moves = game.moves({ square: id, verbose: true });
            moves.forEach(m => {
                const targetSq = document.querySelector(`.square[data-id="${m.to}"]`);
                if (game.get(m.to)) targetSq.classList.add('hint-capture');
                else targetSq.classList.add('hint-move');
            });
        }
    }

    function attemptMove(moveObj) {
        try {
            const result = game.move(moveObj);
            if (result) {
                selectedSquare = null;
                redoStack = [];
                drawPieces();
                updateUI();
                return true;
            }
        } catch (e) { return false; }
        return false;
    }

    // --- MODO EDITOR ---

    function toggleEditor() {
        isEditorMode = !isEditorMode;
        selectedSquare = null; // Limpa seleções de jogo
        
        if (isEditorMode) {
            btnEditor.classList.add('active');
            btnEditor.innerText = "Sair do Editor";
            boardEl.classList.add('editing');
            editorControls.style.display = 'flex';
            // Desabilita controles de jogo
            btnUndo.disabled = true;
            btnRedo.disabled = true;
            statusEl.innerText = "MODO EDITOR: Clique numa casa para colocar/remover peças.";
        } else {
            btnEditor.classList.remove('active');
            btnEditor.innerText = "Modo Editor";
            boardEl.classList.remove('editing');
            editorControls.style.display = 'none';
            redoStack = []; // Limpa histórico ao sair do editor para evitar conflitos
            drawPieces();
            updateUI();
        }
    }

    function clearBoard() {
        game.clear();
        drawPieces();
    }

    function setTurn(color) {
        // Chess.js é rígido com turnos. Para forçar a vez, pegamos o FEN e alteramos a cor ativa.
        let fen = game.fen();
        let parts = fen.split(' ');
        parts[1] = color; // 'w' ou 'b'
        // Resetar relógio e en-passant para evitar erros
        parts[3] = '-'; 
        const newFen = parts.join(' ');
        game.load(newFen);
        updateStatus();
    }

    // --- SELETOR DE PEÇAS (MODAL) ---

    function createPieceSelector() {
        const grid = document.getElementById('selectorGrid');
        grid.innerHTML = '';
        const types = ['p', 'n', 'b', 'r', 'q', 'k'];
        const colors = ['w', 'b'];

        // Cria ícones para peças brancas e pretas
        colors.forEach(c => {
            types.forEach(t => {
                const div = document.createElement('div');
                div.className = 'selector-piece';
                div.style.backgroundImage = `url(${getPieceUrl(c, t)})`;
                div.onclick = () => placePiece(c, t);
                grid.appendChild(div);
            });
        });

        // Botão de remover peça (lixeira)
        const trash = document.createElement('div');
        trash.className = 'selector-trash';
        trash.innerText = "Remover Peça / Vazio";
        trash.onclick = () => removePiece();
        grid.appendChild(trash);
    }

    function openPieceSelector() {
        pieceSelectorModal.style.display = 'flex';
    }

    function closePieceSelector() {
        pieceSelectorModal.style.display = 'none';
        editingSquare = null;
    }

    function placePiece(color, type) {
        if (editingSquare) {
            // Remove qualquer peça existente primeiro para garantir
            game.remove(editingSquare);
            // Coloca a nova peça
            game.put({ type: type, color: color }, editingSquare);
            drawPieces();
        }
        closePieceSelector();
    }

    function removePiece() {
        if (editingSquare) {
            game.remove(editingSquare);
            drawPieces();
        }
        closePieceSelector();
    }

    // --- SISTEMA ---

    function updateStatus() {
        if (isEditorMode) {
            statusEl.innerText = `Editando... Vez de começar: ${game.turn() === 'w' ? 'Brancas' : 'Pretas'}`;
            return;
        }

        let msg = '';
        const turn = game.turn() === 'w' ? 'Brancas' : 'Pretas';

        if (game.in_checkmate()) {
            msg = `Xeque-mate! Vitória das ${game.turn() === 'w' ? 'Pretas' : 'Brancas'}`;
        } else if (game.in_draw()) {
            msg = 'Empate!';
        } else {
            msg = `Vez das ${turn}`;
            if (game.in_check()) msg += ' (XEQUE!)';
        }
        statusEl.innerText = msg;
    }

    function updateUI() {
        if (isEditorMode) return;
        btnUndo.disabled = game.history().length === 0;
        btnRedo.disabled = redoStack.length === 0;
    }

    function undoMove() {
        if(isEditorMode) return;
        const move = game.undo();
        if (move) {
            redoStack.push(move);
            selectedSquare = null;
            drawPieces();
            updateUI();
        }
    }

    function redoMove() {
        if(isEditorMode) return;
        if (redoStack.length > 0) {
            const move = redoStack.pop();
            game.move(move);
            selectedSquare = null;
            drawPieces();
            updateUI();
        }
    }

    function restartGame() {
        game.reset();
        redoStack = [];
        selectedSquare = null;
        if (isEditorMode) toggleEditor(); // Sai do editor se reiniciar
        drawPieces();
        updateUI();
    }

    initBoard();

</script>
</body>
</html>
