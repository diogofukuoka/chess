<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xadrez Master - Versão Definitiva</title>
    <!-- Biblioteca de lógica Chess.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        :root {
            /* Paleta de Cores Premium */
            --bg-body: #262522;
            --bg-panel: #262522;
            --board-border: #3c3b39;
            --square-light: #f0d9b5; 
            --square-dark: #b58863;
            --coord-color: #8b8987;
            
            /* Destaques */
            --highlight-selected: rgba(20, 85, 30, 0.5); /* Verde seleção */
            --highlight-move: rgba(0, 0, 0, 0.15); /* Bola de movimento */
            --highlight-capture: rgba(0, 0, 0, 0.2); /* Aro de captura */
            --highlight-check: radial-gradient(ellipse at center, #ff0000 0%, transparent 60%);
            
            /* Botões */
            --btn-bg: #454441;
            --btn-hover: #585653;
            --btn-active: #3a3936;
            --btn-disabled: #2f2e2c;
            --btn-text: #cacaca;
            --btn-text-disabled: #555;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg-body);
            color: #ccc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
        }

        h1 { margin-bottom: 5px; font-weight: 400; color: #fff; letter-spacing: 0.5px; }

        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            background-color: var(--bg-panel);
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
        }

        /* --- Layout do Tabuleiro e Coordenadas --- */
        .board-container {
            display: grid;
            grid-template-columns: 25px auto;
            grid-template-rows: auto 25px;
        }

        .coords-rank {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            color: var(--coord-color);
            font-size: 13px;
            font-weight: 600;
        }

        .coords-file {
            grid-column: 2;
            display: flex;
            justify-content: space-around;
            align-items: center;
            color: var(--coord-color);
            font-size: 13px;
            font-weight: 600;
            padding-top: 4px;
        }

        #board {
            width: 480px;
            height: 480px;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            border: 3px solid var(--board-border);
            border-radius: 3px;
            overflow: hidden;
        }

        .square {
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: pointer;
        }

        .square.light { background-color: var(--square-light); }
        .square.dark { background-color: var(--square-dark); }
        .square.selected { background-color: var(--highlight-selected) !important; }
        .square.in-check { background: var(--highlight-check); }

        /* --- Dicas Visuais --- */
        .hint-move::after {
            content: '';
            width: 20px;
            height: 20px;
            background-color: var(--highlight-move);
            border-radius: 50%;
            position: absolute;
            pointer-events: none;
        }

        .hint-capture::after {
            content: '';
            width: 54px;
            height: 54px;
            border: 5px solid var(--highlight-capture);
            border-radius: 50%;
            position: absolute;
            pointer-events: none;
        }

        /* --- Peças --- */
        .piece {
            width: 60px;
            height: 60px;
            background-size: 100%; /* SVG preenche bem */
            background-position: center;
            background-repeat: no-repeat;
            z-index: 10;
            transition: transform 0.1s;
        }
        .piece:hover { transform: scale(1.05); }

        /* --- Painel de Status e Botões --- */
        #status {
            font-size: 1rem;
            color: #ddd;
            background: rgba(255,255,255,0.08);
            padding: 6px 16px;
            border-radius: 12px;
            margin-bottom: 5px;
        }

        .controls {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            width: 100%;
            justify-content: center;
        }

        button {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            border-bottom: 3px solid rgba(0,0,0,0.2); /* Efeito 3D sutil */
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        button:hover:not(:disabled) {
            background-color: var(--btn-hover);
            color: #fff;
            transform: translateY(-1px);
        }

        button:active:not(:disabled) {
            transform: translateY(1px);
            border-bottom-width: 0px;
            margin-top: 3px;
        }

        button:disabled {
            background-color: var(--btn-disabled);
            color: var(--btn-text-disabled);
            cursor: not-allowed;
            border-bottom: 3px solid transparent;
            transform: none;
        }

        .btn-restart {
            background-color: #bf4040;
            color: #ffdada;
            margin-left: 10px; /* Separar um pouco dos botões de histórico */
        }
        .btn-restart:hover:not(:disabled) { background-color: #d64a4a; }

        /* Ícones simples nos botões */
        .icon { font-size: 1.1em; line-height: 1; }

    </style>
</head>
<body>

    <div class="game-wrapper">
        <h1>Xadrez Master</h1>
        <div id="status">Vez das Brancas</div>

        <div class="board-container">
            <!-- Números 8-1 -->
            <div class="coords-rank">
                <span>8</span><span>7</span><span>6</span><span>5</span>
                <span>4</span><span>3</span><span>2</span><span>1</span>
            </div>

            <!-- Tabuleiro -->
            <div id="board"></div>

            <!-- Canto vazio -->
            <div></div>

            <!-- Letras a-h -->
            <div class="coords-file">
                <span>a</span><span>b</span><span>c</span><span>d</span>
                <span>e</span><span>f</span><span>g</span><span>h</span>
            </div>
        </div>

        <div class="controls">
            <button id="btnUndo" onclick="undoMove()" disabled>
                <span class="icon">&#8630;</span> Voltar
            </button>
            <button id="btnRedo" onclick="redoMove()" disabled>
                Avançar <span class="icon">&#8631;</span>
            </button>
            <button class="btn-restart" onclick="restartGame()">
                Reiniciar
            </button>
        </div>
    </div>

<script>
    const game = new Chess();
    let selectedSquare = null;
    let redoStack = []; // Pilha para refazer jogadas

    const boardEl = document.getElementById('board');
    const statusEl = document.getElementById('status');
    const btnUndo = document.getElementById('btnUndo');
    const btnRedo = document.getElementById('btnRedo');

    // Mapeamento de Peças usando SVGs do GitHub (Lichess - Tema cburnett)
    // Fonte extremamente estável e de alta qualidade.
    const getPieceUrl = (color, type) => {
        const c = color; // 'w' ou 'b'
        const t = type.toUpperCase(); // 'P', 'N', 'B', 'R', 'Q', 'K'
        return `https://raw.githubusercontent.com/lichess-org/lila/master/public/piece/cburnett/${c}${t}.svg`;
    };

    function initBoard() {
        boardEl.innerHTML = '';
        const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
        const ranks = ['8', '7', '6', '5', '4', '3', '2', '1'];
        let isLight = true;

        for (let r = 0; r < 8; r++) {
            for (let f = 0; f < 8; f++) {
                const sqId = files[f] + ranks[r];
                const div = document.createElement('div');
                div.className = `square ${isLight ? 'light' : 'dark'}`;
                div.dataset.id = sqId;
                div.onclick = () => handleSquareClick(sqId);
                boardEl.appendChild(div);
                isLight = !isLight;
            }
            isLight = !isLight;
        }
        drawPieces();
        updateUI();
    }

    function drawPieces() {
        // Limpa visual anterior
        document.querySelectorAll('.square').forEach(sq => {
            sq.innerHTML = '';
            sq.classList.remove('selected', 'hint-move', 'hint-capture', 'in-check');
        });

        // Coloca as peças
        const board = game.board();
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const piece = board[r][c];
                if (piece) {
                    const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
                    const ranks = ['8', '7', '6', '5', '4', '3', '2', '1'];
                    const sqId = files[c] + ranks[r];
                    const sqDiv = document.querySelector(`.square[data-id="${sqId}"]`);
                    
                    if (sqDiv) {
                        const img = document.createElement('div');
                        img.className = 'piece';
                        // Gera a URL baseada na cor e tipo
                        img.style.backgroundImage = `url(${getPieceUrl(piece.color, piece.type)})`;
                        sqDiv.appendChild(img);

                        // Checagem visual de Xeque
                        if (piece.type === 'k' && game.in_check() && piece.color === game.turn()) {
                            sqDiv.classList.add('in-check');
                        }
                    }
                }
            }
        }
        updateStatus();
    }

    function handleSquareClick(id) {
        const clickedPiece = game.get(id);
        
        // 1. Cancelar seleção se clicar na mesma casa
        if (selectedSquare === id) {
            selectedSquare = null;
            drawPieces();
            return;
        }

        // 2. Se já tem seleção, tenta mover
        if (selectedSquare) {
            const selectedPieceObj = game.get(selectedSquare);

            // Lógica de Roque ao clicar no Rei e depois na Torre
            if (selectedPieceObj && selectedPieceObj.type === 'k' && 
                clickedPiece && clickedPiece.type === 'r' && clickedPiece.color === selectedPieceObj.color) {
                
                let castleMove = null;
                // Brancas
                if (selectedSquare === 'e1') {
                    if (id === 'h1') castleMove = 'g1';
                    if (id === 'a1') castleMove = 'c1';
                }
                // Pretas
                if (selectedSquare === 'e8') {
                    if (id === 'h8') castleMove = 'g8';
                    if (id === 'a8') castleMove = 'c8';
                }

                if (castleMove) {
                    if(attemptMove({ from: selectedSquare, to: castleMove })) return;
                }
            }

            // Tenta movimento normal
            if (attemptMove({ from: selectedSquare, to: id, promotion: 'q' })) return;
        }

        // 3. Selecionar nova peça
        if (clickedPiece && clickedPiece.color === game.turn()) {
            selectedSquare = id;
            drawPieces(); // Redesenha para limpar dicas antigas
            
            // Marca casa selecionada
            document.querySelector(`.square[data-id="${id}"]`).classList.add('selected');

            // Mostra movimentos possíveis
            const moves = game.moves({ square: id, verbose: true });
            moves.forEach(m => {
                const targetSq = document.querySelector(`.square[data-id="${m.to}"]`);
                if (game.get(m.to)) {
                    targetSq.classList.add('hint-capture');
                } else {
                    targetSq.classList.add('hint-move');
                }
            });
        }
    }

    // Tenta executar o movimento e atualiza histórico
    function attemptMove(moveObj) {
        const result = game.move(moveObj);
        if (result) {
            selectedSquare = null;
            redoStack = []; // Limpa pilha de avançar pois o histórico mudou
            drawPieces();
            updateUI();
            return true;
        }
        return false;
    }

    // --- Histórico e UI ---

    function updateStatus() {
        let msg = '';
        const turn = game.turn() === 'w' ? 'Brancas' : 'Pretas';

        if (game.in_checkmate()) {
            msg = `Xeque-mate! Vitória das ${game.turn() === 'w' ? 'Pretas' : 'Brancas'}`;
        } else if (game.in_draw()) {
            msg = 'Empate!';
        } else {
            msg = `Vez das ${turn}`;
            if (game.in_check()) msg += ' (XEQUE!)';
        }
        statusEl.innerText = msg;
    }

    function updateUI() {
        // Habilita/Desabilita botões
        btnUndo.disabled = game.history().length === 0;
        btnRedo.disabled = redoStack.length === 0;
    }

    function undoMove() {
        const move = game.undo();
        if (move) {
            redoStack.push(move); // Salva para poder refazer
            selectedSquare = null;
            drawPieces();
            updateUI();
        }
    }

    function redoMove() {
        if (redoStack.length > 0) {
            const move = redoStack.pop();
            game.move(move);
            selectedSquare = null;
            drawPieces();
            updateUI();
        }
    }

    function restartGame() {
        game.reset();
        redoStack = [];
        selectedSquare = null;
        drawPieces();
        updateUI();
    }

    // Iniciar
    initBoard();

</script>
</body>
</html>
