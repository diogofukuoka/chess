<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xadrez Master - Ultimate Editor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        :root {
            --bg-body: #262522;
            --bg-panel: #262522;
            --board-border: #3c3b39;
            --square-light: #f0d9b5; 
            --square-dark: #b58863;
            --coord-color: #8b8987;
            
            --highlight-selected: rgba(20, 85, 30, 0.5);
            --highlight-move: rgba(0, 0, 0, 0.15);
            --highlight-capture: rgba(0, 0, 0, 0.2);
            --highlight-check: radial-gradient(ellipse at center, #ff0000 0%, transparent 60%);
            
            --btn-bg: #454441;
            --btn-hover: #585653;
            --btn-disabled: #2f2e2c;
            --btn-text: #cacaca;
            --modal-bg: rgba(0, 0, 0, 0.85);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg-body);
            color: #ccc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
        }

        h1 { margin-bottom: 5px; font-weight: 400; color: #fff; letter-spacing: 0.5px; }

        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            background-color: var(--bg-panel);
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
            position: relative;
        }

        .board-container {
            display: grid;
            grid-template-columns: 25px auto;
            grid-template-rows: auto 25px;
        }

        .coords-rank, .coords-file {
            display: flex;
            justify-content: space-around;
            align-items: center;
            color: var(--coord-color);
            font-size: 13px;
            font-weight: 600;
        }
        .coords-rank { flex-direction: column; }
        .coords-file { grid-column: 2; padding-top: 4px; }

        #board {
            width: 480px;
            height: 480px;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            border: 3px solid var(--board-border);
            border-radius: 3px;
            overflow: hidden;
        }

        #board.editing { border-color: #d69e2e; }

        .square {
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: pointer;
        }

        .square.light { background-color: var(--square-light); }
        .square.dark { background-color: var(--square-dark); }
        .square.selected { background-color: var(--highlight-selected) !important; }
        .square.in-check { background: var(--highlight-check); }

        .hint-move::after {
            content: ''; width: 20px; height: 20px;
            background-color: var(--highlight-move);
            border-radius: 50%; position: absolute; pointer-events: none;
        }
        .hint-capture::after {
            content: ''; width: 54px; height: 54px;
            border: 5px solid var(--highlight-capture);
            border-radius: 50%; position: absolute; pointer-events: none;
        }

        .piece {
            width: 60px; height: 60px;
            background-size: 100%; background-position: center;
            background-repeat: no-repeat; z-index: 10;
            pointer-events: none;
        }

        #status {
            font-size: 1rem; color: #ddd;
            background: rgba(255,255,255,0.08);
            padding: 6px 16px; border-radius: 12px;
            margin-bottom: 5px;
        }

        .controls {
            display: flex; gap: 8px; margin-top: 10px;
            width: 100%; justify-content: center; flex-wrap: wrap;
        }

        button {
            background-color: var(--btn-bg); color: var(--btn-text);
            border: none; padding: 10px 16px;
            font-size: 14px; font-weight: 600;
            border-radius: 4px; cursor: pointer;
            border-bottom: 3px solid rgba(0,0,0,0.2);
            transition: all 0.15s;
        }
        button:hover:not(:disabled) { background-color: var(--btn-hover); color: #fff; transform: translateY(-1px); }
        button:active:not(:disabled) { transform: translateY(1px); border-bottom-width: 0; margin-top: 3px; }
        button:disabled { background-color: var(--btn-disabled); color: #555; cursor: not-allowed; border-bottom: 3px solid transparent; transform: none; }

        .btn-restart { background-color: #bf4040; color: #ffdada; }
        .btn-restart:hover:not(:disabled) { background-color: #d64a4a; }
        .btn-editor { background-color: #d69e2e; color: #3e2c00; }
        .btn-editor:hover:not(:disabled) { background-color: #ecc94b; }
        .btn-editor.active { background-color: #b7791f; box-shadow: inset 0 3px 5px rgba(0,0,0,0.2); border-bottom: 0; transform: translateY(2px); margin-top: 2px;}

        .editor-controls {
            display: none; flex-direction: column; gap: 10px; margin-top: 10px;
            padding: 15px; background: rgba(0,0,0,0.2);
            border-radius: 5px; width: 100%; align-items: center;
            box-sizing: border-box;
        }

        .editor-row {
            display: flex; gap: 10px; justify-content: center; width: 100%; flex-wrap: wrap;
        }
        
        .divider {
            width: 100%; height: 1px; background: rgba(255,255,255,0.1); margin: 5px 0;
        }

        /* Botões de Pincel */
        .btn-paint { opacity: 0.6; border: 2px solid transparent; }
        .btn-paint.active-paint { opacity: 1; border-color: #d69e2e; background-color: #555; box-shadow: 0 0 10px rgba(214, 158, 46, 0.3); }

        .btn-play-white { background-color: #e0e0e0; color: #333; }
        .btn-play-white:hover:not(:disabled) { background-color: #fff; }
        .btn-play-black { background-color: #333; color: #ddd; }
        .btn-play-black:hover:not(:disabled) { background-color: #444; }

        #pieceSelectorModal {
            display: none; position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--modal-bg); z-index: 100;
            border-radius: 8px; flex-direction: column;
            justify-content: center; align-items: center; gap: 20px;
        }
        .selector-grid {
            display: grid; grid-template-columns: repeat(6, 1fr);
            gap: 10px; background: #333; padding: 20px;
            border-radius: 8px; box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        .selector-piece {
            width: 50px; height: 50px; cursor: pointer;
            transition: transform 0.2s;
            background-size: contain; background-repeat: no-repeat; background-position: center;
        }
        .selector-piece:hover { transform: scale(1.2); }
        .selector-trash {
            grid-column: span 6; background-color: #bf4040;
            color: white; text-align: center; padding: 10px;
            border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px;
        }
        .selector-cancel {
            background: transparent; color: #aaa;
            border: 1px solid #555; padding: 5px 15px; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <h1>Xadrez Master</h1>
        <div id="status">Vez das Brancas</div>

        <div class="board-container">
            <div class="coords-rank">
                <span>8</span><span>7</span><span>6</span><span>5</span><span>4</span><span>3</span><span>2</span><span>1</span>
            </div>
            <div id="board"></div>
            <div></div>
            <div class="coords-file">
                <span>a</span><span>b</span><span>c</span><span>d</span><span>e</span><span>f</span><span>g</span><span>h</span>
            </div>
        </div>

        <div class="controls">
            <button id="btnUndo" onclick="undoMove()" disabled>Voltar</button>
            <button id="btnRedo" onclick="redoMove()" disabled>Avançar</button>
            <button class="btn-restart" onclick="restartGame()">Reiniciar</button>
            <button id="btnEditor" class="btn-editor" onclick="toggleEditor()">Modo Editor</button>
        </div>

        <!-- Controles do Editor Expandidos -->
        <div id="editorControls" class="editor-controls">
            
            <div class="editor-row">
                <span style="display:flex; align-items:center; font-size:12px; color:#aaa; margin-right:5px;">Pincel (Linhas 3-6):</span>
                <button id="btnPaintWhite" class="btn-paint active-paint" onclick="setPaintColor('w')">⚪ Peão Branco</button>
                <button id="btnPaintBlack" class="btn-paint" onclick="setPaintColor('b')">⚫ Peão Preto</button>
            </div>

            <div class="divider"></div>

            <div class="editor-row">
                <button onclick="clearBoard()" style="background:#c0392b; color:white;">🗑️ Limpar Tudo</button>
            </div>
            
            <div class="editor-row">
                <button class="btn-play-white" onclick="startGameAs('w')">Jogar de Brancas</button>
                <button class="btn-play-black" onclick="startGameAs('b')">Jogar de Pretas</button>
            </div>
        </div>

        <div id="pieceSelectorModal">
            <h3 style="color:white; margin:0;">Escolha a Peça</h3>
            <div class="selector-grid" id="selectorGrid"></div>
            <button class="selector-cancel" onclick="closePieceSelector()">Cancelar</button>
        </div>
    </div>

<script>
    const game = new Chess();
    let selectedSquare = null;
    let redoStack = [];
    let isEditorMode = false;
    let editingSquare = null;
    
    // Variáveis para o sistema de "pintar" o tabuleiro
    let isDragging = false; 
    let hasMovedDuringDrag = false;
    let paintColor = 'w'; // Cor padrão do pincel para linhas 3-6

    const boardEl = document.getElementById('board');
    const statusEl = document.getElementById('status');
    const btnUndo = document.getElementById('btnUndo');
    const btnRedo = document.getElementById('btnRedo');
    const btnEditor = document.getElementById('btnEditor');
    const editorControls = document.getElementById('editorControls');
    const pieceSelectorModal = document.getElementById('pieceSelectorModal');
    const btnPaintWhite = document.getElementById('btnPaintWhite');
    const btnPaintBlack = document.getElementById('btnPaintBlack');

    const standardBackRank = ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'];

    const getPieceUrl = (color, type) => {
        return `https://raw.githubusercontent.com/lichess-org/lila/master/public/piece/cburnett/${color}${type.toUpperCase()}.svg`;
    };

    document.addEventListener('mouseup', () => { isDragging = false; });

    function initBoard() {
        boardEl.innerHTML = '';
        const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
        const ranks = ['8', '7', '6', '5', '4', '3', '2', '1'];
        let isLight = true;

        for (let r = 0; r < 8; r++) {
            for (let f = 0; f < 8; f++) {
                const sqId = files[f] + ranks[r];
                const div = document.createElement('div');
                div.className = `square ${isLight ? 'light' : 'dark'}`;
                div.dataset.id = sqId;
                
                div.onclick = () => handleSquareClick(sqId);
                div.onmousedown = (e) => startPaint(sqId, e);
                div.onmouseenter = () => continuePaint(sqId);

                boardEl.appendChild(div);
                isLight = !isLight;
            }
            isLight = !isLight;
        }
        createPieceSelector();
        drawPieces();
        updateUI();
    }

    // --- LÓGICA DO PINCEL ---
    function setPaintColor(color) {
        paintColor = color;
        if (color === 'w') {
            btnPaintWhite.classList.add('active-paint');
            btnPaintBlack.classList.remove('active-paint');
        } else {
            btnPaintBlack.classList.add('active-paint');
            btnPaintWhite.classList.remove('active-paint');
        }
    }

    function startPaint(sqId, e) {
        if (!isEditorMode) return;
        isDragging = true;
        hasMovedDuringDrag = false;
        tryFillSmart(sqId);
    }

    function continuePaint(sqId) {
        if (!isEditorMode || !isDragging) return;
        hasMovedDuringDrag = true;
        tryFillSmart(sqId);
    }

    function tryFillSmart(sqId) {
        const rank = parseInt(sqId[1]); // converte para número (1 a 8)
        const file = sqId[0];
        
        // Linhas 1 e 8: Peças Maiores Padrão
        if (rank === 1 || rank === 8) {
            const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
            const fileIdx = files.indexOf(file);
            const pieceType = standardBackRank[fileIdx];
            const color = (rank === 1) ? 'w' : 'b';
            game.put({ type: pieceType, color: color }, sqId);
            drawPieces();
        }
        // Linhas 2 e 7: Peões Padrão
        else if (rank === 2 || rank === 7) {
            const color = (rank === 2) ? 'w' : 'b';
            game.put({ type: 'p', color: color }, sqId);
            drawPieces();
        }
        // Linhas 3, 4, 5, 6: Peões da COR SELECIONADA (Paint Color)
        else if (rank >= 3 && rank <= 6) {
            game.put({ type: 'p', color: paintColor }, sqId);
            drawPieces();
        }
    }

    function drawPieces() {
        document.querySelectorAll('.square').forEach(sq => {
            sq.innerHTML = '';
            sq.classList.remove('selected', 'hint-move', 'hint-capture', 'in-check');
        });

        const board = game.board();
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const piece = board[r][c];
                if (piece) {
                    const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
                    const ranks = ['8', '7', '6', '5', '4', '3', '2', '1'];
                    const sqId = files[c] + ranks[r];
                    const sqDiv = document.querySelector(`.square[data-id="${sqId}"]`);
                    
                    if (sqDiv) {
                        const img = document.createElement('div');
                        img.className = 'piece';
                        img.style.backgroundImage = `url(${getPieceUrl(piece.color, piece.type)})`;
                        sqDiv.appendChild(img);

                        if (!isEditorMode && piece.type === 'k' && game.in_check() && piece.color === game.turn()) {
                            sqDiv.classList.add('in-check');
                        }
                    }
                }
            }
        }
        updateStatus();
    }

    function handleSquareClick(id) {
        if (isEditorMode) {
            if (hasMovedDuringDrag) return;
            editingSquare = id;
            openPieceSelector();
            return;
        }

        const clickedPiece = game.get(id);
        
        if (selectedSquare === id) { selectedSquare = null; drawPieces(); return; }

        if (selectedSquare) {
            const selectedPieceObj = game.get(selectedSquare);
            if (selectedPieceObj && selectedPieceObj.type === 'k' && 
                clickedPiece && clickedPiece.type === 'r' && clickedPiece.color === selectedPieceObj.color) {
                let castleMove = null;
                if (selectedSquare === 'e1') { if (id === 'h1') castleMove = 'g1'; if (id === 'a1') castleMove = 'c1'; }
                if (selectedSquare === 'e8') { if (id === 'h8') castleMove = 'g8'; if (id === 'a8') castleMove = 'c8'; }
                if (castleMove && attemptMove({ from: selectedSquare, to: castleMove })) return;
            }
            if (attemptMove({ from: selectedSquare, to: id, promotion: 'q' })) return;
        }

        if (clickedPiece && clickedPiece.color === game.turn()) {
            selectedSquare = id;
            drawPieces();
            document.querySelector(`.square[data-id="${id}"]`).classList.add('selected');
            const moves = game.moves({ square: id, verbose: true });
            moves.forEach(m => {
                const targetSq = document.querySelector(`.square[data-id="${m.to}"]`);
                if (game.get(m.to)) targetSq.classList.add('hint-capture');
                else targetSq.classList.add('hint-move');
            });
        }
    }

    function attemptMove(moveObj) {
        try {
            const result = game.move(moveObj);
            if (result) { selectedSquare = null; redoStack = []; drawPieces(); updateUI(); return true; }
        } catch (e) { return false; }
        return false;
    }

    function toggleEditor() {
        isEditorMode = !isEditorMode;
        selectedSquare = null;
        
        if (isEditorMode) {
            btnEditor.classList.add('active');
            btnEditor.innerText = "Sair do Editor";
            boardEl.classList.add('editing');
            editorControls.style.display = 'flex';
            btnUndo.disabled = true;
            btnRedo.disabled = true;
            statusEl.innerText = "MODO EDITOR: Arraste para preencher. Use o Pincel para Linhas 3-6.";
        } else {
            btnEditor.classList.remove('active');
            btnEditor.innerText = "Modo Editor";
            boardEl.classList.remove('editing');
            editorControls.style.display = 'none';
            redoStack = [];
            drawPieces();
            updateUI();
        }
    }

    function clearBoard() { game.clear(); drawPieces(); }

    function startGameAs(color) {
        if (!game.king('w') || !game.king('b')) { alert("O tabuleiro precisa de 2 Reis!"); return; }
        let fen = game.fen();
        let parts = fen.split(' ');
        parts[1] = color; parts[3] = '-'; parts[4] = '0'; parts[5] = '1';
        const newFen = parts.join(' ');
        try {
            if(game.load(newFen)) { toggleEditor(); updateStatus(); }
            else { alert("Posição inválida."); }
        } catch(e) { alert("Erro ao carregar."); }
    }

    function createPieceSelector() {
        const grid = document.getElementById('selectorGrid');
        grid.innerHTML = '';
        const types = ['p', 'n', 'b', 'r', 'q', 'k'];
        const colors = ['w', 'b'];
        colors.forEach(c => {
            types.forEach(t => {
                const div = document.createElement('div');
                div.className = 'selector-piece';
                div.style.backgroundImage = `url(${getPieceUrl(c, t)})`;
                div.onclick = () => placePiece(c, t);
                grid.appendChild(div);
            });
        });
        const trash = document.createElement('div');
        trash.className = 'selector-trash';
        trash.innerText = "Remover / Vazio";
        trash.onclick = () => removePiece();
        grid.appendChild(trash);
    }

    function openPieceSelector() { pieceSelectorModal.style.display = 'flex'; }
    function closePieceSelector() { pieceSelectorModal.style.display = 'none'; editingSquare = null; }

    function placePiece(color, type) {
        if (editingSquare) {
            game.remove(editingSquare);
            game.put({ type: type, color: color }, editingSquare);
            drawPieces();
        }
        closePieceSelector();
    }

    function removePiece() {
        if (editingSquare) { game.remove(editingSquare); drawPieces(); }
        closePieceSelector();
    }

    function updateStatus() {
        if (isEditorMode) return;
        let msg = '';
        const turn = game.turn() === 'w' ? 'Brancas' : 'Pretas';
        if (game.in_checkmate()) { msg = `Xeque-mate! Vitória das ${game.turn() === 'w' ? 'Pretas' : 'Brancas'}`; } 
        else if (game.in_draw()) { msg = 'Empate!'; } 
        else { msg = `Vez das ${turn}`; if (game.in_check()) msg += ' (XEQUE!)'; }
        statusEl.innerText = msg;
    }

    function updateUI() {
        if (isEditorMode) return;
        btnUndo.disabled = game.history().length === 0;
        btnRedo.disabled = redoStack.length === 0;
    }

    function undoMove() {
        if(isEditorMode) return;
        const move = game.undo();
        if (move) { redoStack.push(move); selectedSquare = null; drawPieces(); updateUI(); }
    }

    function redoMove() {
        if(isEditorMode) return;
        if (redoStack.length > 0) { const move = redoStack.pop(); game.move(move); selectedSquare = null; drawPieces(); updateUI(); }
    }

    function restartGame() {
        game.reset(); redoStack = []; selectedSquare = null;
        if (isEditorMode) toggleEditor();
        drawPieces(); updateUI();
    }

    initBoard();
</script>
</body>
</html>
