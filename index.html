<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xadrez Master - Versão Final</title>
    <!-- Importa chess.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        :root {
            --bg-body: #302e2b;
            --bg-board: #302e2b;
            --square-light: #eeeed2;
            --square-dark: #769656;
            --coord-color: #999;
            --highlight-last: rgba(255, 255, 50, 0.5); /* Amarelo translúcido */
            --highlight-hover: rgba(255, 255, 255, 0.3); /* Branco translúcido */
            --dot-color: rgba(0,0,0,0.15);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-body);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 { margin-bottom: 5px; font-weight: 400; letter-spacing: 1px; }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        /* Estrutura do Tabuleiro com Coordenadas Externas */
        .board-layout {
            display: grid;
            grid-template-columns: 25px auto; /* Margem esquerda para números */
            grid-template-rows: auto 25px;    /* Margem inferior para letras */
            user-select: none;
        }

        /* Coordenadas Laterais (1-8) */
        .coords-rank {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            color: var(--coord-color);
            font-size: 14px;
            font-weight: 600;
            height: 480px; /* Mesma altura do tabuleiro */
        }

        /* Coordenadas Inferiores (a-h) */
        .coords-file {
            grid-column: 2;
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            align-items: center;
            color: var(--coord-color);
            font-size: 14px;
            font-weight: 600;
            width: 480px; /* Mesma largura do tabuleiro */
            margin-top: 5px;
        }

        /* O Tabuleiro */
        #board {
            width: 480px;
            height: 480px;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            border: 3px solid #444;
            border-radius: 3px;
        }

        .square {
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: pointer;
        }

        .square.light { background-color: var(--square-light); }
        .square.dark { background-color: var(--square-dark); }

        /* Estilos de Destaque */
        .square.selected {
            background-color: #bbc !important; /* Cor de seleção azulada/cinza */
        }

        /* Bolinha de movimento */
        .hint-move::after {
            content: '';
            width: 20px;
            height: 20px;
            background-color: var(--dot-color);
            border-radius: 50%;
            position: absolute;
        }

        /* Aro de captura */
        .hint-capture::after {
            content: '';
            width: 50px;
            height: 50px;
            border: 5px solid var(--dot-color);
            border-radius: 50%;
            position: absolute;
        }

        /* Rei em Xeque */
        .in-check {
            background: radial-gradient(ellipse at center, #ff4444 0%, transparent 70%);
        }

        /* Peças */
        .piece {
            width: 60px;
            height: 60px;
            background-size: 90%;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 10;
            transition: transform 0.1s;
        }
        
        .piece:hover {
            transform: scale(1.05);
        }

        /* Painel de Controle e Status */
        .controls {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        button {
            background-color: #403d39;
            color: #fff;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background 0.2s;
            font-weight: bold;
        }

        button:hover { background-color: #55524e; }
        button:active { transform: translateY(1px); }

        button.btn-restart { background-color: #85a94e; }
        button.btn-restart:hover { background-color: #96bc5c; }

        #status {
            font-size: 1.2rem;
            background: rgba(0,0,0,0.2);
            padding: 8px 20px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
        }

    </style>
</head>
<body>

    <div class="main-container">
        <h1>Xadrez Clássico</h1>
        <div id="status">Vez das Brancas</div>

        <div class="board-layout">
            <!-- Coordenadas Esquerda (8 a 1) -->
            <div class="coords-rank">
                <span>8</span><span>7</span><span>6</span><span>5</span>
                <span>4</span><span>3</span><span>2</span><span>1</span>
            </div>

            <!-- Tabuleiro -->
            <div id="board"></div>

            <!-- Espaço vazio canto inferior esquerdo -->
            <div></div>

            <!-- Coordenadas Baixo (a a h) -->
            <div class="coords-file">
                <span>a</span><span>b</span><span>c</span><span>d</span>
                <span>e</span><span>f</span><span>g</span><span>h</span>
            </div>
        </div>

        <div class="controls">
            <button onclick="undoMove()">Voltar Jogada</button>
            <button class="btn-restart" onclick="restartGame()">Reiniciar Jogo</button>
        </div>
    </div>

<script>
    // Inicialização da Lógica
    const game = new Chess();
    let selectedSquare = null;
    const boardEl = document.getElementById('board');
    const statusEl = document.getElementById('status');

    // URLs verificadas e funcionais da Wikimedia Commons
    const pieceImages = {
        'w': {
            'p': 'https://upload.wikimedia.org/wikipedia/commons/4/45/Chess_plt45.svg',
            'r': 'https://upload.wikimedia.org/wikipedia/commons/7/72/Chess_rlt45.svg',
            'n': 'https://upload.wikimedia.org/wikipedia/commons/7/70/Chess_nlt45.svg',
            'b': 'https://upload.wikimedia.org/wikipedia/commons/b/b1/Chess_blt45.svg',
            'q': 'https://upload.wikimedia.org/wikipedia/commons/1/15/Chess_qlt45.svg',
            'k': 'https://upload.wikimedia.org/wikipedia/commons/4/42/Chess_klt45.svg'
        },
        'b': {
            'p': 'https://upload.wikimedia.org/wikipedia/commons/c/c7/Chess_pdt45.svg',
            'r': 'https://upload.wikimedia.org/wikipedia/commons/f/ff/Chess_rdt45.svg',
            'n': 'https://upload.wikimedia.org/wikipedia/commons/e/ef/Chess_ndt45.svg',
            'b': 'https://upload.wikimedia.org/wikipedia/commons/9/98/Chess_bdt45.svg',
            'q': 'https://upload.wikimedia.org/wikipedia/commons/4/47/Chess_qdt45.svg',
            'k': 'https://upload.wikimedia.org/wikipedia/commons/f/f0/Chess_kdt45.svg'
        }
    };

    function initBoard() {
        boardEl.innerHTML = '';
        const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
        const ranks = ['8', '7', '6', '5', '4', '3', '2', '1'];
        let isLight = true;

        for (let r = 0; r < 8; r++) {
            for (let f = 0; f < 8; f++) {
                const squareId = files[f] + ranks[r];
                const div = document.createElement('div');
                div.className = `square ${isLight ? 'light' : 'dark'}`;
                div.dataset.id = squareId;
                div.onclick = () => handleSquareClick(squareId);
                boardEl.appendChild(div);
                isLight = !isLight;
            }
            isLight = !isLight;
        }
        drawPieces();
    }

    function drawPieces() {
        // Limpa estados visuais anteriores
        document.querySelectorAll('.square').forEach(sq => {
            sq.innerHTML = ''; // Remove peça antiga
            sq.classList.remove('selected', 'hint-move', 'hint-capture', 'in-check');
        });

        // Posiciona peças
        const boardState = game.board();
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const piece = boardState[r][c];
                if (piece) {
                    const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
                    const ranks = ['8', '7', '6', '5', '4', '3', '2', '1'];
                    const sqId = files[c] + ranks[r];
                    const sqDiv = document.querySelector(`.square[data-id="${sqId}"]`);
                    
                    if (sqDiv) {
                        const imgDiv = document.createElement('div');
                        imgDiv.className = 'piece';
                        imgDiv.style.backgroundImage = `url(${pieceImages[piece.color][piece.type]})`;
                        sqDiv.appendChild(imgDiv);

                        // Checagem visual de Rei em xeque
                        if (piece.type === 'k' && game.in_check() && piece.color === game.turn()) {
                            sqDiv.classList.add('in-check');
                        }
                    }
                }
            }
        }
        updateStatus();
    }

    function handleSquareClick(id) {
        const piece = game.get(id);
        const turn = game.turn(); // 'w' ou 'b'

        // 1. Se clicou na mesma casa selecionada -> Desseleciona
        if (selectedSquare === id) {
            selectedSquare = null;
            drawPieces();
            return;
        }

        // 2. Tentar mover se já temos uma seleção
        if (selectedSquare) {
            const move = game.move({
                from: selectedSquare,
                to: id,
                promotion: 'q' // Sempre promove para Rainha para simplificar
            });

            if (move) {
                selectedSquare = null;
                drawPieces();
                return;
            }
        }

        // 3. Selecionar nova peça (somente se for a vez dela)
        if (piece && piece.color === turn) {
            selectedSquare = id;
            drawPieces(); // Redesenha para limpar dicas anteriores
            
            // Marca seleção
            document.querySelector(`.square[data-id="${id}"]`).classList.add('selected');

            // Mostra dicas de movimento
            const moves = game.moves({ square: id, verbose: true });
            moves.forEach(m => {
                const targetSq = document.querySelector(`.square[data-id="${m.to}"]`);
                // Se a casa destino tem peça, é captura
                if (game.get(m.to)) {
                    targetSq.classList.add('hint-capture');
                } else {
                    targetSq.classList.add('hint-move');
                }
            });
        }
    }

    function updateStatus() {
        let msg = '';
        const colorName = game.turn() === 'w' ? 'Brancas' : 'Pretas';

        if (game.in_checkmate()) {
            msg = `Xeque-mate! Vitória das ${game.turn() === 'w' ? 'Pretas' : 'Brancas'}`;
        } else if (game.in_draw()) {
            msg = 'Empate!';
        } else {
            msg = `Vez das ${colorName}`;
            if (game.in_check()) msg += ' (XEQUE!)';
        }
        statusEl.innerText = msg;
    }

    function undoMove() {
        game.undo();
        selectedSquare = null;
        drawPieces();
    }

    function restartGame() {
        game.reset();
        selectedSquare = null;
        drawPieces();
    }

    // Iniciar
    initBoard();

</script>
</body>
</html>
