<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xadrez Clássico - Perfeito</title>
    <!-- Importa chess.js para a lógica do jogo -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        :root {
            --bg-body: #302e2b; /* Fundo escuro como na imagem */
            --bg-panel: #302e2b; /* Fundo do painel igual ao corpo */
            --square-light: #f0d9b5; /* Bege claro */
            --square-dark: #b58863; /* Marrom escuro */
            --coord-color: #999;
            --highlight-selected: rgba(255, 255, 0, 0.6); /* Amarelo translúcido para seleção */
            --highlight-move-dot: rgba(0, 0, 0, 0.2); /* Ponto de movimento */
            --highlight-move-border: rgba(0, 0, 0, 0.3); /* Borda de captura */
            --highlight-check: radial-gradient(ellipse at center, #ff4444 0%, transparent 70%); /* Vermelho para xeque */
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-body);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            user-select: none; /* Impede seleção de texto */
        }

        h1 { margin-bottom: 5px; font-weight: 300; letter-spacing: 2px; }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            background-color: var(--bg-panel);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Layout Grid para Coordenadas Externas e Tabuleiro */
        .board-layout {
            display: grid;
            grid-template-columns: 25px auto; /* Coluna para os números + Tabuleiro */
            grid-template-rows: auto 25px;    /* Linha para o Tabuleiro + Letras */
        }

        /* Coordenadas Laterais (Números 8-1) */
        .coords-rank {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            color: var(--coord-color);
            font-weight: bold;
            font-size: 14px;
            height: 480px; /* Mesma altura do tabuleiro */
        }

        /* Coordenadas Inferiores (Letras a-h) */
        .coords-file {
            grid-column: 2; /* Garante que fique abaixo do tabuleiro */
            display: flex;
            justify-content: space-around;
            align-items: center;
            color: var(--coord-color);
            font-weight: bold;
            font-size: 14px;
            width: 480px; /* Mesma largura do tabuleiro */
            margin-top: 5px;
        }

        /* O Tabuleiro */
        #board {
            width: 480px;
            height: 480px;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            border: 4px solid var(--square-dark); /* Borda do tabuleiro */
            border-radius: 2px;
            overflow: hidden; /* Garante que as peças não ultrapassem a borda */
        }

        .square {
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: pointer;
            transition: background-color 0.1s ease-out; /* Suaviza a troca de cor */
        }

        .square.light { background-color: var(--square-light); }
        .square.dark { background-color: var(--square-dark); }

        /* Estilos de Destaque */
        .square.selected { background-color: var(--highlight-selected) !important; }
        .square.in-check { background: var(--highlight-check); }

        /* Indicadores de movimento (círculo e aro) */
        .hint-move::after {
            content: '';
            width: 22px;
            height: 22px;
            background-color: var(--highlight-move-dot);
            border-radius: 50%;
            position: absolute;
            pointer-events: none; /* Não interfere no clique da casa */
        }

        .hint-capture::after {
            content: '';
            width: 54px; /* Maior para formar o aro */
            height: 54px;
            border: 4px solid var(--highlight-move-border);
            border-radius: 50%;
            position: absolute;
            pointer-events: none;
        }

        /* Peças */
        .piece {
            width: 60px;
            height: 60px;
            background-size: 90%; /* Ajuste para ter um pequeno respiro */
            background-position: center;
            background-repeat: no-repeat;
            z-index: 5;
            transition: transform 0.1s;
        }
        .piece:hover { transform: scale(1.05); }

        /* Painel de Controle e Status */
        .controls {
            display: flex;
            gap: 15px;
            width: 100%;
            justify-content: center;
            margin-top: 10px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        button:hover { transform: translateY(-1px); }
        button:active { transform: translateY(0); }
        
        .btn-undo { background-color: #555; color: white; }
        .btn-undo:hover { background-color: #6a6a6a; }

        .btn-restart { background-color: #f44336; color: white; } /* Vermelho mais vibrante */
        .btn-restart:hover { background-color: #ef5350; }

        #status {
            font-size: 1.2rem;
            color: #fff;
            background: rgba(0,0,0,0.3);
            padding: 8px 20px;
            border-radius: 20px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <h1>Xadrez Clássico</h1>
        <div id="status">Vez das Brancas</div>

        <div class="board-layout">
            <!-- Coordenadas 8-1 -->
            <div class="coords-rank">
                <span>8</span><span>7</span><span>6</span><span>5</span>
                <span>4</span><span>3</span><span>2</span><span>1</span>
            </div>

            <!-- Tabuleiro -->
            <div id="board"></div>

            <!-- Canto vazio para alinhamento -->
            <div></div>

            <!-- Coordenadas A-H -->
            <div class="coords-file">
                <span>a</span><span>b</span><span>c</span><span>d</span>
                <span>e</span><span>f</span><span>g</span><span>h</span>
            </div>
        </div>

        <div class="controls">
            <button class="btn-undo" onclick="undoMove()">Voltar Jogada</button>
            <button class="btn-restart" onclick="restartGame()">Reiniciar Jogo</button>
        </div>
    </div>

<script>
    const game = new Chess();
    let selectedSquare = null;
    const boardEl = document.getElementById('board');
    const statusEl = document.getElementById('status');

    // URLs Oficiais da Wikimedia Commons (Verificadas e Estáveis)
    const pieceImages = {
        'w': {
            'p': 'https://upload.wikimedia.org/wikipedia/commons/1/10/Chess_plt45.svg', /* Peão Branco - VERIFICADO */
            'r': 'https://upload.wikimedia.org/wikipedia/commons/7/72/Chess_rlt45.svg',
            'n': 'https://upload.wikimedia.org/wikipedia/commons/7/70/Chess_nlt45.svg',
            'b': 'https://upload.wikimedia.org/wikipedia/commons/b/b1/Chess_blt45.svg',
            'q': 'https://upload.wikimedia.org/wikipedia/commons/1/15/Chess_qlt45.svg',
            'k': 'https://upload.wikimedia.org/wikipedia/commons/4/42/Chess_klt45.svg'
        },
        'b': {
            'p': 'https://upload.wikimedia.org/wikipedia/commons/c/c7/Chess_pdt45.svg',
            'r': 'https://upload.wikimedia.org/wikipedia/commons/f/ff/Chess_rdt45.svg',
            'n': 'https://upload.wikimedia.org/wikipedia/commons/e/ef/Chess_ndt45.svg',
            'b': 'https://upload.wikimedia.org/wikipedia/commons/9/98/Chess_bdt45.svg',
            'q': 'https://upload.wikimedia.org/wikipedia/commons/4/47/Chess_qdt45.svg',
            'k': 'https://upload.wikimedia.org/wikipedia/commons/f/f0/Chess_kdt45.svg'
        }
    };

    function initBoard() {
        boardEl.innerHTML = '';
        const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
        const ranks = ['8', '7', '6', '5', '4', '3', '2', '1'];
        let isLight = true;

        for (let r = 0; r < 8; r++) {
            for (let f = 0; f < 8; f++) {
                const sqId = files[f] + ranks[r];
                const div = document.createElement('div');
                div.className = `square ${isLight ? 'light' : 'dark'}`;
                div.dataset.id = sqId;
                div.onclick = () => handleSquareClick(sqId);
                boardEl.appendChild(div);
                isLight = !isLight;
            }
            isLight = !isLight;
        }
        drawPieces();
    }

    function drawPieces() {
        // Limpa estados visuais anteriores e remove peças antigas
        document.querySelectorAll('.square').forEach(sq => {
            sq.innerHTML = ''; // Remove a imagem da peça
            sq.classList.remove('selected', 'hint-move', 'hint-capture', 'in-check');
        });

        // Posiciona as peças conforme o estado atual do jogo
        const board = game.board();
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const piece = board[r][c];
                if (piece) {
                    const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
                    const ranks = ['8', '7', '6', '5', '4', '3', '2', '1'];
                    const sqId = files[c] + ranks[r];
                    const sqDiv = document.querySelector(`.square[data-id="${sqId}"]`);
                    
                    if (sqDiv) {
                        const img = document.createElement('div');
                        img.className = 'piece';
                        // Atribui a imagem da peça
                        img.style.backgroundImage = `url(${pieceImages[piece.color][piece.type]})`;
                        sqDiv.appendChild(img);

                        // Destaque para Rei em xeque
                        if (piece.type === 'k' && game.in_check() && piece.color === game.turn()) {
                            sqDiv.classList.add('in-check');
                        }
                    }
                }
            }
        }
        updateStatus();
    }

    function handleSquareClick(id) {
        const clickedPiece = game.get(id);
        
        // 1. Clicou na mesma casa selecionada -> Desseleciona
        if (selectedSquare === id) {
            selectedSquare = null;
            drawPieces();
            return;
        }

        // 2. Se já tem algo selecionado, tenta mover
        if (selectedSquare) {
            const selectedPieceObj = game.get(selectedSquare);

            // LÓGICA DE ROQUE APRIMORADA: Rei clicado seguido de Torre clicada
            if (selectedPieceObj && selectedPieceObj.type === 'k' && 
                clickedPiece && clickedPiece.type === 'r' && clickedPiece.color === selectedPieceObj.color &&
                (selectedSquare === 'e1' && (id === 'h1' || id === 'a1') || 
                 selectedSquare === 'e8' && (id === 'h8' || id === 'a8'))) 
            {
                let castleTarget = null;
                // Roque Brancas
                if (selectedSquare === 'e1' && id === 'h1') castleTarget = 'g1'; // Roque pequeno
                if (selectedSquare === 'e1' && id === 'a1') castleTarget = 'c1'; // Roque grande
                // Roque Pretas
                if (selectedSquare === 'e8' && id === 'h8') castleTarget = 'g8'; // Roque pequeno
                if (selectedSquare === 'e8' && id === 'a8') castleTarget = 'c8'; // Roque grande

                if (castleTarget) {
                    const move = game.move({ from: selectedSquare, to: castleTarget });
                    if (move) {
                        selectedSquare = null;
                        drawPieces();
                        return;
                    }
                }
            }
            
            // Tentativa de movimento normal
            const move = game.move({
                from: selectedSquare,
                to: id,
                promotion: 'q' // Sempre promove para Rainha para simplificar
            });

            if (move) {
                selectedSquare = null;
                drawPieces();
                return;
            }
        }

        // 3. Selecionar nova peça (apenas se for a vez da cor)
        if (clickedPiece && clickedPiece.color === game.turn()) {
            selectedSquare = id;
            drawPieces(); // Limpa dicas anteriores
            
            // Adiciona destaque na peça selecionada
            document.querySelector(`.square[data-id="${id}"]`).classList.add('selected');

            // Mostra movimentos possíveis
            const moves = game.moves({ square: id, verbose: true });
            moves.forEach(m => {
                const targetDiv = document.querySelector(`.square[data-id="${m.to}"]`);
                if (game.get(m.to)) { // Se há uma peça na casa destino, é uma captura
                    targetDiv.classList.add('hint-capture');
                } else { // Caso contrário, é um movimento simples
                    targetDiv.classList.add('hint-move');
                }
            });
        }
    }

    function updateStatus() {
        let msg = '';
        const turnColorName = game.turn() === 'w' ? 'Brancas' : 'Pretas';

        if (game.in_checkmate()) {
            msg = `Xeque-mate! Vitória das ${game.turn() === 'w' ? 'Pretas' : 'Brancas'}`;
        } else if (game.in_draw()) {
            msg = 'Empate!';
        } else {
            msg = `Vez das ${turnColorName}`;
            if (game.in_check()) msg += ' (XEQUE!)';
        }
        statusEl.innerText = msg;
    }

    function undoMove() {
        game.undo();
        selectedSquare = null;
        drawPieces();
    }

    function restartGame() {
        game.reset();
        selectedSquare = null;
        drawPieces();
    }

    // Inicializa o jogo ao carregar a página
    initBoard();
</script>
</body>
</html>
